<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070c16"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#122334"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2e6c9" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f2e6c9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#f2e6c9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2a65a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f2a65a" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f2a65a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a26"/>
      <stop offset="100%" stop-color="#050a12"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1a28"/>
      <stop offset="100%" stop-color="#0a1420"/>
    </linearGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#edeff3" opacity="0.6">
    <circle cx="120" cy="80" r="1.4"/>
    <circle cx="260" cy="140" r="1"/>
    <circle cx="410" cy="60" r="1.6"/>
    <circle cx="560" cy="120" r="1"/>
    <circle cx="700" cy="50" r="1.3"/>
    <circle cx="820" cy="150" r="1"/>
    <circle cx="960" cy="90" r="1.5"/>
    <circle cx="1080" cy="160" r="1"/>
    <circle cx="180" cy="220" r="1"/>
    <circle cx="340" cy="200" r="1.2"/>
    <circle cx="620" cy="200" r="1"/>
    <circle cx="900" cy="220" r="1.2"/>
    <circle cx="1120" cy="70" r="1"/>
    <circle cx="60" cy="180" r="1"/>
  </g>

  <!-- moon with soft glow -->
  <circle cx="940" cy="150" r="160" fill="url(#moonGlow)"/>
  <circle cx="940" cy="150" r="46" fill="#f2e6c9" opacity="0.95"/>

  <!-- far hills / treeline silhouette -->
  <path d="M0,480 C150,440 300,470 450,450 C600,430 750,460 900,440 C1000,428 1100,445 1200,435 L1200,900 L0,900 Z"
        fill="url(#hillFar)"/>

  <!-- near riverbank silhouette -->
  <path d="M0,560 C180,520 360,560 540,540 C720,520 900,555 1080,530 C1130,524 1170,528 1200,524 L1200,900 L0,900 Z"
        fill="#070c16"/>

  <!-- river with rippled reflection bands -->
  <rect x="0" y="600" width="1200" height="300" fill="url(#river)"/>
  <g stroke="#f2a65a" stroke-opacity="0.12" stroke-width="2">
    <path d="M0,640 Q300,630 600,640 T1200,640"/>
    <path d="M0,690 Q300,678 600,690 T1200,690"/>
    <path d="M0,740 Q300,730 600,740 T1200,740"/>
    <path d="M0,800 Q300,790 600,800 T1200,800"/>
  </g>

  <!-- floating lanterns above the water, echoing the site's motif -->
  <circle cx="230" cy="600" r="60" fill="url(#lanternGlow)"/>
  <circle cx="230" cy="600" r="6" fill="#f2a65a"/>

  <circle cx="640" cy="580" r="50" fill="url(#lanternGlow)"/>
  <circle cx="640" cy="580" r="5" fill="#f2a65a"/>

  <circle cx="1000" cy="610" r="70" fill="url(#lanternGlow)"/>
  <circle cx="1000" cy="610" r="7" fill="#f2a65a"/>

  <circle cx="420" cy="660" r="34" fill="url(#lanternGlow)" opacity="0.7"/>
  <circle cx="420" cy="660" r="4" fill="#f2a65a" opacity="0.8"/>
</svg>
